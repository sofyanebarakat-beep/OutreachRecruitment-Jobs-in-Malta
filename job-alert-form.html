<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Job alert form definition</title></head>
<body>
  <!-- Netlify scans this static form at deploy time. The visible form is rendered by job-eligibility-gate.js. -->
  <form name="worldwide-job-alert" data-netlify="true" netlify-honeypot="website" hidden>
    <input type="hidden" name="form-name" value="worldwide-job-alert">
    <input name="website">
    <input name="full_name">
    <input name="email" type="email">
    <input name="country">
    <input name="country_name">
    <input name="source_job">
    <input name="source_url">
    <input name="consent">
  </form>
</body>
</html>
