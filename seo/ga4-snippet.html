<!-- GA4 async loader — paste inside <head> -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX', {
    // Recommended settings for a recruitment site
    'send_page_view': true,
    'anonymize_ip': true,            // GDPR
    'allow_google_signals': false,   // GDPR — enable if you want remarketing
    'allow_ad_personalization_signals': false  // GDPR
  });
