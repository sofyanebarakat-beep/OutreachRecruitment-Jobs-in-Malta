<!-- ============================================================
  JobPosting Schema — Google Jobs compatible
  Paste inside <head> of EACH individual job page.
  Replace ALL_CAPS_VARS with real values.

  Google Jobs requirements:
  - title, description, datePosted, validThrough required
  - hiringOrganization required
  - jobLocation OR jobLocationType (remote) required
  - baseSalary strongly recommended (improves ranking)
  - All text must match visible page content exactly
  ============================================================ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "JobPosting",

  "title": "JOB_TITLE",
  "description": "FULL_JOB_DESCRIPTION_HTML_OR_PLAIN_TEXT",

  "datePosted": "YYYY-MM-DD",
  "validThrough": "YYYY-MM-DD",

  "employmentType": "EMPLOYMENT_TYPE",
  /* Valid values: FULL_TIME | PART_TIME | CONTRACTOR | TEMPORARY |
     INTERN | VOLUNTEER | PER_DIEM | OTHER                          */

  "url": "https://outreachrecruitment.net/jobs/JOB_SLUG",

  "hiringOrganization": {
    "@type": "Organization",
    "name": "Outreach Recruitment",
    "sameAs": "https://outreachrecruitment.net",
    "logo": "https://outreachrecruitment.net/assets/outreach-recruitment-logo.svg"
  },

  "jobLocation": {
    "@type": "Place",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "STREET_ADDRESS_OR_OMIT",
      "addressLocality": "CITY",
      "addressRegion": "REGION_OR_OMIT",
      "postalCode": "POSTAL_CODE_OR_OMIT",
      "addressCountry": "MT"
    }
  },

  /* For remote roles — replace jobLocation block above with this:
  "jobLocationType": "TELECOMMUTE",
  "applicantLocationRequirements": {
    "@type": "Country",
    "name": "Malta"
  },
  */

  "baseSalary": {
    "@type": "MonetaryAmount",
    "currency": "EUR",
    "value": {
      "@type": "QuantitativeValue",
      "minValue": MIN_SALARY,
      "maxValue": MAX_SALARY,
      "unitText": "MONTH"
      /* unitText options: HOUR | DAY | WEEK | MONTH | YEAR */
    }
  },

  "industry": "JOB_INDUSTRY",
  "occupationalCategory": "JOB_CATEGORY",

  "skills": "COMMA_SEPARATED_SKILLS",

  "educationRequirements": {
    "@type": "EducationalOccupationalCredential",
    "credentialCategory": "EDUCATION_LEVEL"
  },

  "experienceRequirements": {
    "@type": "OccupationalExperienceRequirements",
    "monthsOfExperience": MONTHS_EXPERIENCE
  },

  "jobBenefits": "BENEFITS_TEXT",

  "responsibilities": "RESPONSIBILITIES_TEXT",

  "qualifications": "QUALIFICATIONS_TEXT",

  "directApply": true,

  "applicationContact": {
    "@type": "ContactPoint",
    "email": "hr@outreachrecruitment.net",
    "contactType": "Human Resources"
  },

  "identifier": {
    "@type": "PropertyValue",
    "name": "Outreach Recruitment",
    "value": "JOB_INTERNAL_ID"
  }
}
</script>
