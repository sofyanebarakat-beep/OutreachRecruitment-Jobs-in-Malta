<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-labelledby="t">
  <title id="t">Outreach Recruitment newsletter</title>
  <style>
    .float { animation: float 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .f2 { animation-delay: -1.6s; } .f3 { animation-delay: -3.1s; }
    .letter { animation: peek 4.5s ease-in-out infinite; }
    .spark { animation: twinkle 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .s2 { animation-delay: -.9s; } .s3 { animation-delay: -1.7s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes peek { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="env" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b55ff"/><stop offset="1" stop-color="#2a17c9"/></linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a44ff"/><stop offset="1" stop-color="#3a24e6"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#442DFA" stop-opacity=".55"/><stop offset="1" stop-color="#442DFA" stop-opacity="0"/></radialGradient>
  </defs>

  <circle cx="280" cy="270" r="230" fill="url(#glow)"/>

  <!-- envelope back -->
  <rect x="110" y="200" width="340" height="200" rx="22" fill="#2a17c9"/>
  <!-- letter rising out of the envelope -->
    <g class="letter">
      <rect x="150" y="110" width="260" height="250" rx="16" fill="#fff"/>
      <rect x="178" y="140" width="96" height="14" rx="7" fill="#442DFA"/>
      <rect x="178" y="172" width="204" height="10" rx="5" fill="#e3e0f7"/>
      <rect x="178" y="194" width="170" height="10" rx="5" fill="#e3e0f7"/>
      <rect x="178" y="226" width="60" height="44" rx="10" fill="#eeebff"/>
      <rect x="250" y="230" width="132" height="10" rx="5" fill="#e3e0f7"/>
      <rect x="250" y="252" width="100" height="10" rx="5" fill="#e3e0f7"/>
    </g>
  <!-- envelope front -->
  <path d="M110 222 280 318 450 222v156a22 22 0 0 1-22 22H132a22 22 0 0 1-22-22z" fill="url(#env)"/>
  <path d="M110 400 252 302M450 400 308 302" stroke="#ffffff" stroke-opacity=".18" stroke-width="3"/>
  <path d="M110 222 280 318 450 222" fill="none" stroke="url(#flap)" stroke-width="4" stroke-linejoin="round"/>

  <!-- floating badges: jobs, study, alerts -->
  <g class="float">
    <circle cx="92" cy="140" r="38" fill="#fff"/>
    <g transform="translate(72 120)" fill="none" stroke="#442DFA" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <rect x="4" y="12" width="32" height="24" rx="4"/><path d="M14 12V8a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v4M4 22h32"/>
    </g>
  </g>
  <g class="float f2">
    <circle cx="478" cy="118" r="36" fill="#fff"/>
    <g transform="translate(458 98)" fill="none" stroke="#442DFA" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M2 16 20 8l18 8-18 8z"/><path d="M10 20v8c0 3 5 5 10 5s10-2 10-5v-8M38 16v10"/>
    </g>
  </g>
  <g class="float f3">
    <circle cx="498" cy="300" r="30" fill="#fff"/>
    <g transform="translate(482 284)" fill="none" stroke="#442DFA" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M16 3a9 9 0 0 1 9 9v6l3 5H4l3-5v-6a9 9 0 0 1 9-9zM12 27a4 4 0 0 0 8 0"/>
    </g>
    <circle cx="518" cy="280" r="9" fill="#ff5a5f"/>
  </g>

  <!-- sparkles -->
  <path class="spark" d="M70 300l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#b7aefc"/>
  <path class="spark s2" d="M400 60l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fff"/>
  <path class="spark s3" d="M200 52l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#b7aefc"/>
</svg>
