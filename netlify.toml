[build]
  publish = "."

# ── Blog articles — redirect old /blog/* URLs to root ──────────────────────
[[redirects]]
  from = "/blog/:slug/"
  to = "/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/blog/:slug"
  to = "/:slug"
  status = 301
  force = true

