[build]
  publish = "."

# ── Blog articles — redirect old /blog/* URLs to root ──────────────────────
[[redirects]]
  from = "/blog/:slug/"
  to = "/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/blog/:slug"
  to = "/:slug"
  status = 301
  force = true

# ── Study in Malta Complete Guide — canonical trailing-slash URL ───────────
[[redirects]]
  from = "/study-in-malta-complete-guide"
  to = "/study-in-malta-complete-guide/"
  status = 301
  force = true

[[redirects]]
  from = "/study-in-malta-complete-guide.html"
  to = "/study-in-malta-complete-guide/"
  status = 301
  force = true

# ── Study in Malta from Morocco — clean root article URL ───────────────────
[[redirects]]
