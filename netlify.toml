# ── Any URL with a tracking suffix (e.g. /page/kala100) ───────────────────
[[redirects]]
  from = "/bus-driver-jobs-in-malta/*"
  to = "https://outreachrecruitment.net"
  status = 301
  force = true

# ── Catch-all: serve existing .html files, else 301 to homepage ───────────
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "https://outreachrecruitment.net"
  status = 301

# ── Cache headers ──────────────────────────────────────────────────────────
# Immutable assets (versioned filenames) — cache 1 year
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages — revalidate on each visit (content changes frequently)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/jobs/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
