[build]
  publish = "."

# ── Blog articles — redirect old /blog/* URLs to root ──────────────────────
[[redirects]]
  from = "/blog/:slug/"
  to = "/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/blog/:slug"
  to = "/:slug"
  status = 301
  force = true

# ── Study in Malta Complete Guide — canonical trailing-slash URL ───────────
[[redirects]]
  from = "/study-in-malta-complete-guide"
  to = "/study-in-malta-complete-guide/"
  status = 301
  force = true

[[redirects]]
  from = "/study-in-malta-complete-guide.html"
  to = "/study-in-malta-complete-guide/"
  status = 301
  force = true

# ── Malta Study Guide — redirect old /malta-study-guide/* to root slug ─────
[[redirects]]
  from = "/malta-study-guide/:slug/"
  to = "/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/malta-study-guide/:slug"
  to = "/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/faqs"
  to = "/faqs.html"
  status = 200

[[redirects]]
  from = "/job/:slug/"
  to = "/jobs/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/job/:slug"
  to = "/jobs/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/jobs/:slug.html"
  to = "/jobs/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache headers ──────────────────────────────────────────────────────────
# Immutable assets (versioned filenames) — cache 1 year
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages — revalidate on each visit (content changes frequently)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/jobs/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
