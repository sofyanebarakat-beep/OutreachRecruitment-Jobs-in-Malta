  status = 301
  force = true

[[redirects]]
  from = "/tag/*"
  to = "https://outreachrecruitment.net"
  status = 301
  force = true

[[redirects]]
  from = "/author/*"
  to = "https://outreachrecruitment.net"
  status = 301
  force = true

[[redirects]]
  from = "/programs-and-courses/*"
  to = "https://outreachrecruitment.net"
  status = 301
  force = true

[[redirects]]
  from = "/study-in-malta-from-africa"
  to = "https://outreachrecruitment.net"
