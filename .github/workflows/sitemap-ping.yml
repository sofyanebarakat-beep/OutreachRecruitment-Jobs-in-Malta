name: Ping Google Sitemap

# DISABLED on push (2026-08-27). Google retired the /ping?sitemap= endpoint in
# 2023 and Bing's equivalent is deprecated too, so this did nothing useful while
# still spending Actions minutes on every push. Manual-only now; real indexing
# goes through the Google Indexing API in tools/ and Search Console.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Google sitemap index
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://outreachrecruitment.net/sitemap_index.xml"
          echo "Sitemap pinged."

      - name: Ping Bing / IndexNow sitemap
        run: |
          curl -s "https://www.bing.com/ping?sitemap=https://outreachrecruitment.net/sitemap_index.xml"
          echo "Bing pinged."
