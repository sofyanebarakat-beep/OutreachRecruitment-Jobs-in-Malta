name: Generate and publish daily SEO articles

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: Number of drafts
        required: false
        default: "5"

permissions:
  contents: write
  models: read
  issues: write

concurrency:
  group: daily-seo-posts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate article drafts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_MODEL: openai/gpt-4.1-mini
          COUNT: ${{ inputs.count || '5' }}
        run: python3 "SEO Emp and Candidates/automation/generate_daily_posts.py" --count "$COUNT"

      - name: Build and publish live pages
        id: publish
        run: |
          DATE="$(date -u +%F)"
          python3 "SEO Emp and Candidates/automation/publish_article.py" "SEO Emp and Candidates/generated/daily/$DATE" | tee publish_output.txt
          SUMMARY_LINE="$(tail -1 publish_output.txt)"
          {
            echo "summary<<EOF_SUMMARY"
            echo "$SUMMARY_LINE"
            echo "EOF_SUMMARY"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push published pages to main
        env:
          PUBLISH_SUMMARY: ${{ steps.publish.outputs.summary }}
        run: |
          git config user.name "outreach-seo-agent[bot]"
          git config user.email "outreach-seo-agent[bot]@users.noreply.github.com"
          DATE="$(date -u +%F)"

          # Draft markdown (including any that failed validation and were left
          # unpublished) is always committed, so nothing generated is ever lost.
          git add "SEO Emp and Candidates/automation/state.json" "SEO Emp and Candidates/generated/daily/$DATE"

          # Only the exact files publish_article.py actually built/modified —
          # never a broad `git add .`, which could sweep in unrelated
          # in-progress work from other jobs touching this repo.
          echo "$PUBLISH_SUMMARY" \
            | python3 -c 'import json,sys; [print(p) for p in json.load(sys.stdin)["touched_paths"]]' \
            | while IFS= read -r path; do git add -- "$path"; done

          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "content: publish SEO articles for $DATE"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Flag any drafts that failed to publish
        env:
          PUBLISH_SUMMARY: ${{ steps.publish.outputs.summary }}
        run: |
          SKIPPED="$(echo "$PUBLISH_SUMMARY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["skipped"])')"
          if [ "$SKIPPED" != "0" ]; then
            echo "::warning::$SKIPPED draft(s) failed to build into a live page today and were left as Markdown only in SEO Emp and Candidates/generated/daily/ — see the 'Build and publish live [...]
          fi

      # Loud, visible signal if a run fails — so this can't silently stop for
      # weeks again (as it did after 2026-07-30). Reuses one issue, re-opening it.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "daily-seo-posts workflow is failing";
            const body = [
              `The daily SEO article workflow failed on ${new Date().toISOString().slice(0,10)}.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `Common causes: GitHub Actions spending limit reached, GitHub Models`,
              `rate limit / access, or the push step blocked by branch protection.`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "all", labels: "automation-alert", per_page: 20,
            });
            const hit = existing.data.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, state: "open", body });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: hit.number, body: `Failed again — ${body.split("\n")[2]}` });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["automation-alert"] });
            }
