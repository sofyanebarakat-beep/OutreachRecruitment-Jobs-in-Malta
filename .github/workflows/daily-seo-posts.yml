name: Generate daily SEO article drafts

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: Number of drafts
        required: false
        default: "5"

permissions:
  contents: write
  models: read
  pull-requests: write

concurrency:
  group: daily-seo-posts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate review-ready drafts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_MODEL: openai/gpt-4.1-mini
          COUNT: ${{ inputs.count || '5' }}
        run: python3 "SEO Emp and Candidates/automation/generate_daily_posts.py" --count "$COUNT"
      - name: Persist topic rotation state to main
        run: |
          git config user.name "outreach-seo-agent[bot]"
          git config user.email "outreach-seo-agent[bot]@users.noreply.github.com"
          if git diff --quiet -- "SEO Emp and Candidates/automation/state.json"; then
            echo "No rotation-state change to persist."
          else
            git add "SEO Emp and Candidates/automation/state.json"
            git commit -m "chore: advance SEO topic rotation state"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Open or update the daily review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="$(date -u +%F)"
          BRANCH="automation/seo-drafts-$DATE"
          git config user.name "outreach-seo-agent[bot]"
          git config user.email "outreach-seo-agent[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "SEO Emp and Candidates/generated/daily"
          git commit -m "content: generate SEO drafts for $DATE"
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin "$BRANCH"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            if gh pr create --draft --base main --head "$BRANCH" --title "SEO drafts: $DATE" --body "Automated Outreach Recruitment SEO drafts for $DATE. Human review is required before publication."; then
              echo "PR created."
            else
              echo "::warning::Could not auto-create the PR — GitHub Actions likely lacks pull-request creation permission (Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests'). Drafts are already pushed to branch '$BRANCH'; open a PR from it manually, or enable that setting so this step succeeds automatically next time."
            fi
          else
            gh pr comment "$PR_NUMBER" --body "Drafts regenerated by workflow run $GITHUB_RUN_ID." || echo "::warning::Could not comment on PR #$PR_NUMBER, but drafts are pushed to branch '$BRANCH'."
          fi
