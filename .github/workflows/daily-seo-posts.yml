name: Generate daily SEO article drafts

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: Number of drafts
        required: false
        default: "3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-seo-posts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate review-ready drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          COUNT: ${{ inputs.count || '3' }}
        run: python3 "SEO Emp and Candidates/automation/generate_daily_posts.py" --count "$COUNT"
      - name: Open or update the daily review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="$(date -u +%F)"
          BRANCH="automation/seo-drafts-$DATE"
          git config user.name "outreach-seo-agent[bot]"
          git config user.email "outreach-seo-agent[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "SEO Emp and Candidates/generated/daily" "SEO Emp and Candidates/automation/state.json"
          git commit -m "content: generate 3 SEO drafts for $DATE"
          git push --force-with-lease origin "$BRANCH"
          PR_NUMBER="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --draft --base main --head "$BRANCH" --title "SEO drafts: $DATE" --body "Three automated Outreach Recruitment SEO drafts. Human review is required before publication."
          else
            gh pr comment "$PR_NUMBER" --body "Drafts regenerated by workflow run $GITHUB_RUN_ID."
          fi
