name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Check server structure
        run: |
          ssh-keyscan -H 87o.9a0.myftpupload.com >> ~/.ssh/known_hosts
          echo "=== Home directory ==="
          ssh git_deployer_3284395a1c_133350@87o.9a0.myftpupload.com "pwd && ls -la"
          echo "=== /html/ directory ==="
          ssh git_deployer_3284395a1c_133350@87o.9a0.myftpupload.com "ls -la /html/ | head -30" || echo "/html/ not accessible"
          echo "=== Check index files ==="
          ssh git_deployer_3284395a1c_133350@87o.9a0.myftpupload.com "ls -la ~/index.html ~/index.php 2>/dev/null || echo 'not in home dir'"

      - name: Deploy via rsync
        run: |
          rsync -avz --ignore-errors --no-implied-dirs \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='server.py' \
            ./ \
            git_deployer_3284395a1c_133350@87o.9a0.myftpupload.com:/html/ || \
          CODE=$?; if [ $CODE -ne 23 ]; then exit $CODE; fi; \
          echo "Deployment complete (some protected server files skipped)"
