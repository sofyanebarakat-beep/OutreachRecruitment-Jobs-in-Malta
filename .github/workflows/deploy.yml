name: Deploy to GoDaddy

# DISABLED on push (2026-08-27). The live site is served by GitHub Pages, not
# GoDaddy — this rsync ran on every push to main and was the main drain on the
# monthly Actions minutes, which starved the scheduled daily-seo-posts workflow.
# Kept as manual-only in case the GoDaddy mirror is ever needed again.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via rsync
        run: |
          ssh-keyscan -H 87o.9a0.myftpupload.com >> ~/.ssh/known_hosts
          rsync -avz --ignore-errors --no-implied-dirs \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='server.py' \
            ./ \
            git_deployer_3284395a1c_133350@87o.9a0.myftpupload.com:/html/ || EXIT=$?
          EXIT=${EXIT:-0}
          if [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 23 ]; then
            echo "rsync failed with exit code $EXIT"
            exit "$EXIT"
          fi
          echo "Deployment complete (exit $EXIT — 23 = protected server files skipped, expected)"

      - name: Verify key files on server
        run: |
          ssh git_deployer_3284395a1c_133350@87o.9a0.myftpupload.com \
            "ls -la /html/index.html /html/wp-config.php /html/site-router.php /html/.user.ini 2>&1 || true"
