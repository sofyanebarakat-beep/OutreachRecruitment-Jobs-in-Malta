name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Diagnose server
        run: |
          ssh-keyscan -H 87o.9a0.myftpupload.com >> ~/.ssh/known_hosts
          echo "=== Home + /html/ structure ==="
          ssh git_deployer_3284395a1c_133350@87o.9a0.myftpupload.com "pwd && ls -la && echo '--- /html/ ---' && ls -la /html/ | head -40"
          echo "=== Verify our key files exist ==="
          ssh git_deployer_3284395a1c_133350@87o.9a0.myftpupload.com "ls -la /html/index.html /html/wp-blog-header.php /html/.htaccess 2>&1"
          echo "=== Test PHP execution locally (bypasses CDN) ==="
          ssh git_deployer_3284395a1c_133350@87o.9a0.myftpupload.com "curl -s -o /dev/null -w '%{http_code}' http://localhost/ -H 'Host: outreachrecruitment.net' 2>/dev/null || echo 'curl failed'"
          echo "=== Check if symlink points to /html/ ==="
          ssh git_deployer_3284395a1c_133350@87o.9a0.myftpupload.com "ls -la ~/html 2>/dev/null && readlink -f ~/html 2>/dev/null || echo 'no ~/html symlink'"

      - name: Deploy via rsync
        run: |
          rsync -avz --ignore-errors --no-implied-dirs \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='server.py' \
            ./ \
            git_deployer_3284395a1c_133350@87o.9a0.myftpupload.com:/html/ || \
          CODE=$?; if [ $CODE -ne 23 ]; then exit $CODE; fi; \
          echo "Deployment complete (some protected server files skipped)"
